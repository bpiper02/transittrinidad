name: r7a-dependency-audit

on:
  push:
    branches: [r-hardening-open-source]

permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, 'Run temporary R7a dependency audit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit declared project dependencies
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm audit --json > /tmp/baseline.json || true
          node -e "const a=require('/tmp/baseline.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,vulnerabilities:Object.fromEntries(Object.entries(a.vulnerabilities||{}).map(([k,v])=>[k,{severity:v.severity,isDirect:v.isDirect,range:v.range,via:(v.via||[]).map(x=>typeof x==='string'?x:{name:x.name,title:x.title,severity:x.severity,range:x.range}),fixAvailable:v.fixAvailable}]))},null,2))"
      - name: Audit browser QA dependency set
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts --no-save @playwright/test@1.55.0
          npm audit --json > /tmp/browser.json || true
          node -e "const a=require('/tmp/browser.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,vulnerabilities:Object.fromEntries(Object.entries(a.vulnerabilities||{}).map(([k,v])=>[k,{severity:v.severity,isDirect:v.isDirect,range:v.range,via:(v.via||[]).map(x=>typeof x==='string'?x:{name:x.name,title:x.title,severity:x.severity,range:x.range}),fixAvailable:v.fixAvailable}]))},null,2))"
      - name: Resolved top-level versions
        shell: bash
        run: |
          npm install --ignore-scripts --no-save @playwright/test@1.55.0
          npm ls eslint @playwright/test playwright playwright-core ajv minimatch --all || true
