name: r7a-dependency-audit

on:
  push:
    branches: [r-hardening-open-source]

permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, 'Run temporary R7a dependency audit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit exact current browser QA toolchain
        shell: bash
        run: |
          mkdir -p /tmp/r7a-current
          cd /tmp/r7a-current
          printf '%s\n' '{"private":true,"dependencies":{"eslint":"9.35.0","@playwright/test":"1.55.0"}}' > package.json
          npm install --package-lock-only --ignore-scripts
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,vulnerabilities:Object.fromEntries(Object.entries(a.vulnerabilities||{}).map(([k,v])=>[k,{severity:v.severity,isDirect:v.isDirect,range:v.range,via:(v.via||[]).map(x=>typeof x==='string'?x:{source:x.source,name:x.name,title:x.title,severity:x.severity,range:x.range,url:x.url}),effects:v.effects,fixAvailable:v.fixAvailable}]))},null,2))"
      - name: Discover and audit current Playwright release
        shell: bash
        run: |
          LATEST="$(npm view @playwright/test version)"
          echo "latest_playwright=$LATEST"
          mkdir -p /tmp/r7a-latest
          cd /tmp/r7a-latest
          printf '{"private":true,"dependencies":{"eslint":"9.35.0","@playwright/test":"%s"}}\n' "$LATEST" > package.json
          npm install --package-lock-only --ignore-scripts
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,vulnerabilities:Object.fromEntries(Object.entries(a.vulnerabilities||{}).map(([k,v])=>[k,{severity:v.severity,isDirect:v.isDirect,range:v.range,via:(v.via||[]).map(x=>typeof x==='string'?x:{source:x.source,name:x.name,title:x.title,severity:x.severity,range:x.range,url:x.url}),effects:v.effects,fixAvailable:v.fixAvailable}]))},null,2))"
