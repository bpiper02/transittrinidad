name: diagnose-southwest-nodes
on:
  push:
    branches: [sprint-medium-corridor-bridging-5]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref_name == 'sprint-medium-corridor-bridging-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: List southwest network objects
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const nodes=JSON.parse(await readFile(new URL('./data/nodes.json',import.meta.url)));
          const services=JSON.parse(await readFile(new URL('./data/services.json',import.meta.url)));
          const terms=['fyzabad','point-fortin','point fortin','la-brea','san-fernando','siparia','guapo','cap-de-ville','cap de ville'];
          const match=obj=>terms.some(term=>JSON.stringify(obj).toLowerCase().includes(term));
          console.log('NODES');
          for(const n of nodes.filter(match))console.log(JSON.stringify({id:n.id,name:n.name,kind:n.kind,loc:n.location,confidence:n.locationConfidence}));
          console.log('SERVICES');
          for(const s of services.filter(match))console.log(JSON.stringify({id:s.id,mode:s.mode,corridorId:s.corridorId,origin:s.originNodeId,dest:s.destinationNodeId,stops:s.stopNodeIds,confidence:s.serviceConfidence,boarding:s.boardingPolicy,alighting:s.alightingPolicy,fare:s.fareTTD,name:s.name,operator:s.operator,boardingNote:s.boardingNote}));
          NODE
