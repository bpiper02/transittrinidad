name: apply-medium-corridor-bridging
on:
  push:
    branches: [sprint-medium-corridor-bridging-5]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref_name == 'sprint-medium-corridor-bridging-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch medium corridor bridging
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const files=['src/routing-core.mjs','public/src/routing-core.mjs'];
          const helper='\nfunction sameIslandLocations(a,b){\n  if(!a||!b)return false;\n  const aTobago=a.lat>10.9,bTobago=b.lat>10.9;\n  return aTobago===bTobago;\n}\n\nfunction connectorTransferKey(from,to){return String(from)+\'->\'+String(to);}\n\nfunction localConnectorTransfers(nodes,eligibleNodeIds,existingTransfers=[],options={}){\n  const {allowCorridorBridgeFallback=false,maxBridgeConnectorKm=5,maxBridgeConnectorsPerNode=4,bridgeConnectorPenaltyMinutes=18}=options||{};\n  if(!allowCorridorBridgeFallback)return[];\n  const existing=new Set((existingTransfers||[]).map(transfer=>connectorTransferKey(transfer.fromNodeId,transfer.toNodeId)));\n  const candidates=[...eligibleNodeIds].map(id=>nodes.get(id)).filter(node=>hasValidLocation(node));\n  const transfers=[];\n  for(const from of candidates){\n    const close=[];\n    for(const to of candidates){\n      if(from.id===to.id)continue;\n      if(!sameIslandLocations(from.location,to.location))continue;\n      const key=connectorTransferKey(from.id,to.id);\n      if(existing.has(key))continue;\n      const km=kmBetween(from.location,to.location);\n      if(!Number.isFinite(km)||km<=0.03||km>maxBridgeConnectorKm)continue;\n      close.push({to,km});\n    }\n    close.sort((a,b)=>a.km-b.km);\n    for(const item of close.slice(0,maxBridgeConnectorsPerNode)){\n      const to=item.to,km=item.km;\n      transfers.push({fromNodeId:from.id,toNodeId:to.id,distanceKm:km,estimatedMinutes:Math.round(bridgeConnectorPenaltyMinutes+estimateAccess(km,{...options,walkThresholdKm:0}).minutes),kind:\'local_connector\',isEstimatedConnector:true,note:\'Estimated local connector between nearby corridors; not a surveyed route.\'});\n    }\n  }\n  return transfers;\n}\n';
          for(const file of files){
            let text=fs.readFileSync(file,'utf8');
            if(!text.includes('function localConnectorTransfers(')){
              const target='\nexport function chooseJourneyOptions({';
              if(!text.includes(target))throw new Error(file+': chooseJourneyOptions target not found');
              text=text.replace(target,helper+target);
            }
            const marker='  const virtualAccessPoints=[];\n  for(const candidate of [...virtualStarts,...virtualEnds]){\n    candidateNodes.set(candidate.node.id,candidate.node);\n    if(typeof nodes?.set===\'function\')nodes.set(candidate.node.id,candidate.node);\n    virtualAccessPoints.push(candidate.virtualAccess);\n  }';
            const replacement=marker+'\n  const routingTransfers=rankingOptions.allowCorridorBridgeFallback\n    ? [...transfers,...localConnectorTransfers(candidateNodes,eligibleNodeIds,transfers,{...accessOptions,...rankingOptions})]\n    : transfers;';
            if(!text.includes('const routingTransfers=rankingOptions.allowCorridorBridgeFallback')){
              if(!text.includes(marker))throw new Error(file+': virtual access marker not found');
              text=text.replace(marker,replacement);
            }
            text=text.replaceAll('findJourney(start.node.id,end.node.id,eligibleServices,candidateNodes,{transferPenaltyMinutes,transfers,requiredMode:routeMode,virtualAccessPoints})','findJourney(start.node.id,end.node.id,eligibleServices,candidateNodes,{transferPenaltyMinutes,transfers:routingTransfers,requiredMode:routeMode,virtualAccessPoints})');
            fs.writeFileSync(file,text);
          }
          const appFile='public/app-v2.js';
          let app=fs.readFileSync(appFile,'utf8');
          const oldOptions='rankingOptions:{allowDirectLocalFallback:true,maxDirectLocalFallbackKm:8}});';
          const newOptions='rankingOptions:{allowDirectLocalFallback:true,maxDirectLocalFallbackKm:8,allowCorridorBridgeFallback:true,maxBridgeConnectorKm:5,maxBridgeConnectorsPerNode:4,bridgeConnectorPenaltyMinutes:22}});';
          if(app.includes(oldOptions))app=app.replace(oldOptions,newOptions);
          fs.writeFileSync(appFile,app);
          const testFile='tests/routing-core.mjs';
          let test=fs.readFileSync(testFile,'utf8');
          if(!test.includes('mediumBridgeNodes')){
            const anchor='const farLocalFallback=chooseConnectedJourney({fromPlace:{lat:10.00,lng:-61.00},toPlace:{lat:10.30,lng:-61.00},nodes:new Map(),services:[],rankingOptions:{allowDirectLocalFallback:true,maxDirectLocalFallbackKm:5}});\nassert.equal(farLocalFallback,null,\'direct local fallback must not create long-distance imaginary routes\');';
            const addition=anchor+'\nconst mediumBridgeNodes=new Map([\n  [\'origin-stand\',{id:\'origin-stand\',kind:\'stand\',name:\'Origin Stand\',location:{lat:10.000,lng:-61.000}}],\n  [\'near-gap-west\',{id:\'near-gap-west\',kind:\'stand\',name:\'Near Gap West\',location:{lat:10.020,lng:-61.000}}],\n  [\'near-gap-east\',{id:\'near-gap-east\',kind:\'stand\',name:\'Near Gap East\',location:{lat:10.035,lng:-61.000}}],\n  [\'destination-stand\',{id:\'destination-stand\',kind:\'stand\',name:\'Destination Stand\',location:{lat:10.055,lng:-61.000}}]\n]);\nconst mediumBridgeServices=[\n  {id:\'origin-to-gap\',corridorId:\'origin-gap\',mode:\'maxi\',originNodeId:\'origin-stand\',destinationNodeId:\'near-gap-west\',stopNodeIds:[\'origin-stand\',\'near-gap-west\'],estimatedMinutes:10},\n  {id:\'gap-to-destination\',corridorId:\'gap-destination\',mode:\'route_taxi\',originNodeId:\'near-gap-east\',destinationNodeId:\'destination-stand\',stopNodeIds:[\'near-gap-east\',\'destination-stand\'],estimatedMinutes:10}\n];\nassert.equal(chooseConnectedJourney({fromPlace:mediumBridgeNodes.get(\'origin-stand\').location,toPlace:mediumBridgeNodes.get(\'destination-stand\').location,nodes:new Map(mediumBridgeNodes),services:mediumBridgeServices,knownFrom:mediumBridgeNodes.get(\'origin-stand\'),knownTo:mediumBridgeNodes.get(\'destination-stand\')}),null,\'disconnected corridor fragments should still fail without bridge fallback\');\nconst mediumBridge=chooseConnectedJourney({fromPlace:mediumBridgeNodes.get(\'origin-stand\').location,toPlace:mediumBridgeNodes.get(\'destination-stand\').location,nodes:new Map(mediumBridgeNodes),services:mediumBridgeServices,knownFrom:mediumBridgeNodes.get(\'origin-stand\'),knownTo:mediumBridgeNodes.get(\'destination-stand\'),rankingOptions:{allowCorridorBridgeFallback:true,maxBridgeConnectorKm:3,maxBridgeConnectorsPerNode:2}});\nassert.ok(mediumBridge,\'medium-distance bridge fallback should connect nearby corridor fragments\');\nassert.ok(mediumBridge.steps.some(step=>step.kind===\'transfer\'&&step.transfer?.isEstimatedConnector),\'bridge fallback must be machine-readable as an estimated connector, not verified transit\');\nassert.deepEqual(mediumBridge.modes,[\'maxi\',\'route_taxi\'],\'bridge fallback should preserve the real transit legs around the estimated connector\');';
            if(!test.includes(anchor))throw new Error('test anchor not found');
            test=test.replace(anchor,addition);
          }
          fs.writeFileSync(testFile,test);
          fs.rmSync('.github/workflows/apply-medium-corridor-bridging.yml');
          NODE
      - name: Commit patch
        run: |
          git config user.name "bpiper02"
          git config user.email "93992231+bpiper02@users.noreply.github.com"
          git add src/routing-core.mjs public/src/routing-core.mjs public/app-v2.js tests/routing-core.mjs .github/workflows/apply-medium-corridor-bridging.yml
          git commit -m "feat: bridge nearby corridor fragments"
          git push origin HEAD:sprint-medium-corridor-bridging-5
