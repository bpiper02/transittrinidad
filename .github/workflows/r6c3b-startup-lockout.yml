name: r6c3b-startup-lockout

on:
  push:
    branches: [r-hardening-open-source]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Add temporary R6c3b lockout workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-r6c3b-startup-lockout.mjs
      - run: npm install --no-save eslint@9.35.0 @playwright/test@1.55.0
      - run: npm run check:public
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/startup-resilience.spec.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-v2.js
          git diff --cached --quiet && exit 0
          git commit -m "Lock planner controls when startup data is invalid"
          git push origin HEAD:r-hardening-open-source
