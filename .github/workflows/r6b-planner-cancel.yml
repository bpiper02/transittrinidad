name: r6b-planner-cancel

on:
  push:
    branches: [r-hardening-open-source]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Apply R6b planner cancellation fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-r6b-planner-cancel.mjs
      - run: npm install --no-save eslint@9.35.0
      - run: npm run check:public
      - run: npm run lint
      - run: npm test
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-v2.js
          git diff --cached --quiet && exit 0
          git commit -m "Release planner controls when requests are invalidated"
          git push origin HEAD:r-hardening-open-source
