name: ptsc-regenerate-qa

on:
  push:
    branches:
      - qa/journey-geometry-browser-20260913
    paths:
      - tools/ptsc-inventory-build.mjs

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild PTSC inventory and promoted data
        run: |
          npm run ptsc:inventory
          npm run ptsc:promote
      - name: Validate generated network
        run: |
          npm test
          npm run qa
      - name: Commit generated mirrors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Promote mapped PTSC Couva and Mayaro endpoints"
          git push
