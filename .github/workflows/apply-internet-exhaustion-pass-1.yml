name: apply-internet-exhaustion-pass-1

on:
  push:
    branches: [internet-exhaustion-pass-1]
    paths:
      - '.github/workflows/apply-internet-exhaustion-pass-1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: internet-exhaustion-pass-1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-internet-exhaustion-pass-1.mjs
      - run: npm test
      - name: Commit canonical data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nodes.json data/services.json data/transfers.json data/schedules.json public/data/nodes.json public/data/services.json public/data/transfers.json public/data/schedules.json
          git diff --cached --quiet && exit 0
          git commit -m 'Apply internet exhaustion pass 1 [skip ci]'
          git push origin HEAD:internet-exhaustion-pass-1
# rerun after confidence fix
