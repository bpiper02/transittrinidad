name: corridor-a4b-apply

on:
  push:
    branches: [corridor-integration-sprint]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: corridor-integration-sprint
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-corridor-a4b-princes-town.mjs
      - run: npm test
      - name: Commit generated Princes Town corridor data
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nodes.json public/data/nodes.json data/services.json public/data/services.json data/source/corridor-promotion-manifest-2026-09-12.json
          git commit -m "Promote San Fernando Princes Town local corridor"
          git push origin HEAD:corridor-integration-sprint
