name: apply-web-depth

on:
  push:
    branches: [web-depth-2026-09-12]
    paths:
      - '.github/workflows/apply-web-depth.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-depth-2026-09-12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-web-depth-2026-09-12.mjs
      - run: npm test
      - name: Commit canonical data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nodes.json data/services.json data/transfers.json data/schedules.json public/data/nodes.json public/data/services.json public/data/transfers.json public/data/schedules.json
          git diff --cached --quiet && exit 0
          git commit -m 'Apply official-source web depth batch [skip ci]'
          git push origin HEAD:web-depth-2026-09-12
