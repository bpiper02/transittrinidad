name: browser-qa

on:
  push:
  pull_request:
    branches: [main]

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --reporter=line,html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
