name: apply-connectivity-fallback
on:
  push:
    branches: [sprint-connectivity-fallback]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref_name == 'sprint-connectivity-fallback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch connectivity fallback
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const files=['src/routing-core.mjs','public/src/routing-core.mjs'];
          const oldPolicy=`if(\n    purpose==='boarding'&&\n    service.boardingPolicy==='mixed'&&\n    PASS_THROUGH_MODES.has(service.mode)&&\n    corridorSignal(service)\n  )return 'hail_along_segment';`;
          const newPolicy=`if(\n    (purpose==='boarding'||purpose==='alighting')&&\n    (purpose==='boarding'?service.boardingPolicy:service.alightingPolicy)==='mixed'&&\n    PASS_THROUGH_MODES.has(service.mode)&&\n    corridorSignal(service)\n  )return purpose==='alighting'?'main_road_pass_through':'hail_along_segment';`;
          const helper=`\nfunction fallbackNodeId(prefix,place){\n  return \`virtual-local-\${prefix}-\${Math.round(place.lat*10000)}-\${Math.round(place.lng*10000)}\`.replace(/[^a-zA-Z0-9_-]/g,'-');\n}\n\nfunction directLocalFallbackCandidate({fromPlace,toPlace,nodes,requiredMode,directKm,transferPenaltyMinutes,accessOptions,rankingOptions}){\n  const {allowDirectLocalFallback=false,maxDirectLocalFallbackKm=8,directLocalFallbackPenaltyMinutes=55}=rankingOptions||{};\n  if(!allowDirectLocalFallback)return null;\n  if(requiredMode&&requiredMode!=='route_taxi')return null;\n  if(!fromPlace||!toPlace||!Number.isFinite(fromPlace.lat)||!Number.isFinite(fromPlace.lng)||!Number.isFinite(toPlace.lat)||!Number.isFinite(toPlace.lng))return null;\n  if(!Number.isFinite(directKm)||directKm<=0.03||directKm>maxDirectLocalFallbackKm)return null;\n  const fromNode={id:fallbackNodeId('origin',fromPlace),name:'Estimated local connector start',kind:'stop_zone',location:{lat:fromPlace.lat,lng:fromPlace.lng},locationConfidence:'approximate_area',virtual:true};\n  const toNode={id:fallbackNodeId('destination',toPlace),name:'Estimated local connector destination',kind:'stop_zone',location:{lat:toPlace.lat,lng:toPlace.lng},locationConfidence:'approximate_area',virtual:true};\n  nodes.set(fromNode.id,fromNode);\n  nodes.set(toNode.id,toNode);\n  const minutes=Math.max(6,estimateAccess(directKm,{...accessOptions,walkThresholdKm:0}).minutes);\n  const service={\n    id:\`local-connector-\${fromNode.id}-\${toNode.id}\`,\n    corridorId:'local-connector-fallback',\n    mode:'route_taxi',\n    originNodeId:fromNode.id,\n    destinationNodeId:toNode.id,\n    stopNodeIds:[fromNode.id,toNode.id],\n    estimatedMinutes:minutes,\n    serviceConfidence:'reported_service',\n    boardingPolicy:'hail_along_segment',\n    alightingPolicy:'main_road_pass_through',\n    boardingNote:'No confirmed corridor found; this is a short local connection estimate, not a surveyed route.',\n    sources:[]\n  };\n  const steps=[{kind:'transit',from:fromNode.id,to:toNode.id,service,minutes}];\n  const candidate=candidateFor({node:fromNode,km:0},{node:toNode,km:0},steps,nodes,{transferPenaltyMinutes,accessOptions,toPlace,directKm,rankingOptions,scheduledServiceIds:null,schedules:[],departureDate:null});\n  candidate.score+=directLocalFallbackPenaltyMinutes;\n  candidate.ranking.directLocalFallback={estimated:true,maxKm:maxDirectLocalFallbackKm,directKm};\n  return candidate;\n}\n`;
          for(const file of files){
            let text=fs.readFileSync(file,'utf8');
            if(!text.includes(oldPolicy))throw new Error(`${file}: policy target not found`);
            text=text.replace(oldPolicy,newPolicy);
            if(!text.includes('function directLocalFallbackCandidate(')){
              text=text.replace('\nexport function chooseJourneyOptions({',`${helper}\nexport function chooseJourneyOptions({`);
            }
            const oldSorted=`  const sorted=[...unique.values()].sort((a,b)=>a.score-b.score);\n  if(!sorted.length)return[];`;
            const newSorted=`  const sorted=[...unique.values()].sort((a,b)=>a.score-b.score);\n  if(!sorted.length){\n    const fallback=directLocalFallbackCandidate({fromPlace,toPlace,nodes:candidateNodes,requiredMode,directKm,transferPenaltyMinutes,accessOptions,rankingOptions:candidateRankingOptions});\n    if(fallback)return[fallback];\n    return[];\n  }`;
            if(!text.includes(oldSorted))throw new Error(`${file}: sorted target not found`);
            text=text.replace(oldSorted,newSorted);
            fs.writeFileSync(file,text);
          }
          const testFile='tests/routing-core.mjs';
          let test=fs.readFileSync(testFile,'utf8');
          const anchor=`assert.equal(falseZeroLeg,null,'two arbitrary places must not become a fake zero-transit journey merely because they snap to the same hub');`;
          const addition=`${anchor}\nconst shortLocalFallback=chooseConnectedJourney({fromPlace:{lat:10.40,lng:-61.46},toPlace:{lat:10.42,lng:-61.45},nodes:new Map(sameHubNodes),services:sameHubServices,candidateLimit:1,maxAccessKm:20,rankingOptions:{allowDirectLocalFallback:true,maxDirectLocalFallbackKm:5}});\nassert.ok(shortLocalFallback,'short-distance fallback should prevent a no-route result when explicitly enabled');\nassert.equal(shortLocalFallback.modes[0],'route_taxi','short-distance fallback should be labeled as an estimated local route-taxi connector');\nassert.equal(shortLocalFallback.ranking.directLocalFallback.estimated,true,'fallback must be machine-readable as estimated, not verified');\nconst farLocalFallback=chooseConnectedJourney({fromPlace:{lat:10.00,lng:-61.00},toPlace:{lat:10.30,lng:-61.00},nodes:new Map(),services:[],rankingOptions:{allowDirectLocalFallback:true,maxDirectLocalFallbackKm:5}});\nassert.equal(farLocalFallback,null,'direct local fallback must not create long-distance imaginary routes');`;
          if(!test.includes(anchor))throw new Error('test anchor not found');
          if(!test.includes('shortLocalFallback'))test=test.replace(anchor,addition);
          fs.writeFileSync(testFile,test);
          const appFile='public/app-v2.js';
          let app=fs.readFileSync(appFile,'utf8');
          const oldCall=`maxOptions:3,requiredMode:activeMode==='all'?null:activeMode});`;
          const newCall=`maxOptions:3,requiredMode:activeMode==='all'?null:activeMode,rankingOptions:{allowDirectLocalFallback:true,maxDirectLocalFallbackKm:8}});`;
          if(!app.includes(oldCall))throw new Error('app route options target not found');
          app=app.replace(oldCall,newCall);
          fs.writeFileSync(appFile,app);
          fs.rmSync('.github/workflows/apply-connectivity-fallback.yml');
          NODE
      - name: Commit patch
        run: |
          git config user.name "bpiper02"
          git config user.email "93992231+bpiper02@users.noreply.github.com"
          git add src/routing-core.mjs public/src/routing-core.mjs public/app-v2.js tests/routing-core.mjs .github/workflows/apply-connectivity-fallback.yml
          git commit -m "feat: add short-distance connectivity fallback"
          git push origin HEAD:sprint-connectivity-fallback