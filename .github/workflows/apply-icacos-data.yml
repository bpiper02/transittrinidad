name: apply-icacos-data

on:
  push:
    branches: [sprint-southwest-icacos-ptsc]
    paths:
      - tools/apply-icacos-data.mjs
      - .github/workflows/apply-icacos-data.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-southwest-icacos-ptsc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-icacos-data.mjs
      - name: Commit generated data
        run: |
          rm .github/workflows/apply-icacos-data.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nodes.json public/data/nodes.json data/services.json public/data/services.json data/source/southwest-official-edge-gaps-2026-09-14.json tools/apply-icacos-data.mjs .github/workflows/apply-icacos-data.yml
          git commit -m "feat: add official Icacos PTSC edge" || exit 0
          git push origin HEAD:sprint-southwest-icacos-ptsc
