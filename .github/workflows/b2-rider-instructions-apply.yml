name: b2-rider-instructions-apply

on:
  push:
    branches: [pilot-readiness-sprint]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot-readiness-sprint
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-b2-rider-instructions.mjs
      - run: npm test
      - name: Commit browser integration
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-v2.js
          git commit -m "Wire local rider instruction copy"
          git push origin HEAD:pilot-readiness-sprint
