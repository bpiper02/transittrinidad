<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transit Trinidad — Association Review</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:0 auto;padding:24px;background:#f6f3ea;color:#171717}h1{margin-bottom:4px}.muted{color:#666}.card{background:#fff;border:1px solid #bbb;padding:16px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pane{background:#fafafa;border:1px solid #ddd;padding:12px;overflow:auto}.actions{display:flex;gap:8px;align-items:center;margin-top:12px}button{padding:8px 12px}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}.accepted{border-left:6px solid #2f7d32}.rejected{border-left:6px solid #9f2d2d}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Association Review</h1>
<p class="muted">Local-only helper. Load a candidates JSON file, review each change, then export a review JSON file for the promotion CLI.</p>
<input id="file" type="file" accept="application/json,.json">
<button id="export" disabled>Export review JSON</button>
<div id="summary" class="muted"></div>
<div id="cards"></div>
<script>
let bundle=null;const decisions=new Map();
const file=document.querySelector('#file'),cards=document.querySelector('#cards'),summary=document.querySelector('#summary'),exportButton=document.querySelector('#export');
file.addEventListener('change',async()=>{bundle=JSON.parse(await file.files[0].text());decisions.clear();render();exportButton.disabled=false;});
function render(){cards.innerHTML='';summary.textContent=`${bundle.association||''} • ${bundle.submissionId} • ${bundle.candidates.length} candidate(s)`;for(const candidate of bundle.candidates){const card=document.createElement('section');card.className='card';const decision=decisions.get(candidate.candidateId);if(decision)card.classList.add(decision.decision==='accept'?'accepted':'rejected');const existingId=candidate.changeSet?.existingServiceId;card.innerHTML=`<h2>${escapeHtml(candidate.routeName||candidate.candidateId)}</h2><p><strong>${escapeHtml(candidate.reviewStatus)}</strong> · ${escapeHtml(candidate.candidateId)}</p><div class="grid"><div class="pane"><strong>Current</strong><pre>${escapeHtml(existingId?JSON.stringify({serviceId:existingId},null,2):'No existing directed service matched')}</pre></div><div class="pane"><strong>Association says</strong><pre>${escapeHtml(JSON.stringify({source:{association:candidate.source?.association,receivedAt:candidate.source?.receivedAt},roads:candidate.roads,operation:candidate.operation},null,2))}</pre></div><div class="pane"><strong>Proposed</strong><pre>${escapeHtml(JSON.stringify(candidate.changeSet,null,2))}</pre></div></div><div class="actions"><button data-decision="accept">Accept</button><button data-decision="reject">Reject</button><input placeholder="Reason / note" value="${escapeAttr(decision?.reason||'')}"></div>`;const input=card.querySelector('input');card.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{decisions.set(candidate.candidateId,{candidateId:candidate.candidateId,decision:button.dataset.decision,reason:input.value||undefined});render();}));cards.appendChild(card);}}
exportButton.addEventListener('click',()=>{const review={submissionId:bundle.submissionId,reviewedAt:new Date().toISOString().slice(0,10),reviewer:'local-review',decisions:[...decisions.values()]};const blob=new Blob([JSON.stringify(review,null,2)+'\n'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${bundle.submissionId}-review.json`;a.click();URL.revokeObjectURL(a.href);});
function escapeHtml(value){return String(value??'').replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));}function escapeAttr(value){return escapeHtml(value).replace(/"/g,'&quot;');}
</script>
</body>
</html>
