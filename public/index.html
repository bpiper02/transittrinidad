<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Transit Trinidad</title>
  <meta name="description" content="Plan trips across Trinidad and Tobago's public and shared transport network." />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.8.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="appShell" class="app-shell">
    <div id="map" class="map" aria-label="Transit map of Trinidad and Tobago"></div>

    <header class="topbar">
      <div>
        <strong class="brand">Transit Trinidad</strong>
        <span class="subbrand">One map for PTSC, maxis, taxis and marine transport.</span>
      </div>
      <span class="phase">PHASE 1 · ATLAS</span>
    </header>

    <section class="planner" aria-label="Trip planner">
      <div class="planner-row">
        <label>
          <span>FROM</span>
          <input id="fromInput" list="placeOptions" autocomplete="off" placeholder="San Fernando" />
        </label>
        <button id="swapButton" class="swap" type="button" aria-label="Swap origin and destination">⇅</button>
        <label>
          <span>TO</span>
          <input id="toInput" list="placeOptions" autocomplete="off" placeholder="Arima" />
        </label>
        <button id="planButton" class="plan-button" type="button">FIND ROUTE</button>
      </div>
      <datalist id="placeOptions"></datalist>
      <p id="plannerStatus" class="planner-status" aria-live="polite">Search currently uses verified transport nodes while Phase 1 coverage is being loaded.</p>
    </section>

    <nav class="mode-tabs" id="modeTabs" aria-label="Transport mode filters">
      <button class="is-active" data-mode="all" type="button">All</button>
      <button data-mode="ptsc" type="button">PTSC</button>
      <button data-mode="maxi" type="button">Maxi</button>
      <button data-mode="route_taxi" type="button">Taxi</button>
      <button data-mode="water_taxi" type="button">Water Taxi</button>
      <button data-mode="ferry" type="button">Ferry</button>
    </nav>

    <aside id="detailPanel" class="detail-panel" hidden aria-live="polite"></aside>

    <section id="serviceTray" class="service-tray" aria-label="Visible services">
      <button id="trayToggle" class="tray-toggle" type="button" aria-expanded="false">
        <span>NETWORK</span>
        <strong><span id="serviceCount">0</span> services</strong>
      </button>
      <div id="serviceList" class="service-list" hidden></div>
    </section>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
