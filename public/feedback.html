<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>trinimaps — Route feedback</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d1d1f;background:#f5f3ee}*{box-sizing:border-box}body{margin:0}.shell{max-width:620px;margin:0 auto;padding:32px 18px 60px}a{color:#8d271f}h1{margin:0;font-size:30px;letter-spacing:-.04em}.beta{display:inline-block;margin:0 0 12px;padding:3px 7px;border:1px solid #d9b8b3;border-radius:99px;color:#8d271f;font-size:10px;font-weight:750;text-transform:uppercase}.lede{color:#5d5d61;line-height:1.45}.card{margin-top:22px;padding:18px;background:#fff;border:1px solid #d8d5ce;border-radius:10px}label{display:grid;gap:6px;margin:0 0 14px;font-size:13px;font-weight:700}input,textarea{width:100%;border:1px solid #b9b7b1;border-radius:7px;padding:10px;font:inherit;font-weight:400}textarea{min-height:90px;resize:vertical}button{min-height:44px;border:0;border-radius:7px;padding:0 14px;background:#1d1d1f;color:#fff;font:700 14px system-ui;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid rgba(201,37,45,.35);outline-offset:3px}.status{min-height:20px;color:#5d5d61;font-size:13px}.note{font-size:12px;line-height:1.45;color:#5d5d61}
  </style>
</head>
<body><main class="shell">
  <span class="beta">Public Beta</span><h1>Route feedback</h1>
  <p class="lede">Share a route gap or correction for review. This creates a local review draft; it does not publish a route.</p>
  <section class="card"><form id="gapForm">
    <label>From <input id="from" required placeholder="Origin or area"></label>
    <label>To <input id="to" required placeholder="Destination or area"></label>
    <label>What should we check? <textarea id="notes" placeholder="Boarding point, direction, fare, operating times or source"></textarea></label>
    <button type="submit">Create review draft</button><p id="status" class="status" aria-live="polite"></p>
  </form></section>
  <p class="note">For a correction to a route already in the network, use the <a href="./field-review.html">field route review</a>. Do not submit private contact details in this draft.</p>
  <p class="note"><a href="./index.html">← Back to planner</a></p>
</main>
<script type="module">
import {buildUnresolvedGapReview,unresolvedGapSummary} from './src/gap-review-core.mjs';
const form=document.querySelector('#gapForm'),status=document.querySelector('#status');
form.addEventListener('submit',event=>{event.preventDefault();const gap=buildUnresolvedGapReview({fromPlace:{name:document.querySelector('#from').value},toPlace:{name:document.querySelector('#to').value},notes:document.querySelector('#notes').value});localStorage.setItem('trinimaps-gap-review-draft',JSON.stringify(gap));status.textContent=unresolvedGapSummary(gap)+' Draft saved in this browser for field review.';});
</script>
</body></html>
